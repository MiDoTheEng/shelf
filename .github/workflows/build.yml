name: Build Shelf APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project zip, if it was uploaded as a zip
        run: |
          # When several zips are in the repo (e.g. "Shelf.zip" and "Shelf(1).zip"),
          # unpack them oldest version first, so the newest version always wins.
          shopt -s nullglob
          for z in *.zip; do
            v=$(unzip -p "$z" app/build.gradle 2>/dev/null | grep -o 'versionCode [0-9]*' | grep -o '[0-9]*' | head -n 1)
            echo "${v:-0} $z"
          done | sort -n | while read -r v z; do
            echo "Unpacking $z (version $v)"
            unzip -o -q "$z"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: |
          settings=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          cd "$(dirname "$settings")"
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/Shelf.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Shelf-APK
          path: out/Shelf.apk
